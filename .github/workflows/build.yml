name: Build LXQt CloudOS Based On openSUSE and Publish ISO

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - 'docs/**'
  schedule:
    - cron: '04 17 * * *'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OCI_IMAGE_NAME: my-opensuse-lxqt-cloud-plus
  ISO_BASE_NAME: my-opensuse-lxqt-cloud-plus-iso

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write

    steps:
      - name: Free Disk Space (Ubuntu Runner)
        run: |
          echo "=== 清理前磁盘空间 ==="
          df -h
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get remove -y '^dotnet-.*' '^llvm-.*' 'php.*' 'google-chrome-.*' || true
          sudo apt-get autoremove -y || true
          sudo apt-get clean
          docker system prune -a -f --volumes || true
          echo "=== 清理后磁盘空间 ==="
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Build Metadata
        id: meta
        run: |
          DATE_TAG=$(date -u +'%Y%m%d-%H%M%S')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          if [ "${{ github.event_name }}" = "schedule" ]; then
            RELEASE_TAG="nightly-${DATE_TAG}"
            RELEASE_TITLE="Nightly Build (${DATE_TAG})"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_TAG="manual-${DATE_TAG}-${SHORT_SHA}"
            RELEASE_TITLE="Manual Build (${DATE_TAG}-${SHORT_SHA})"
          else
            RELEASE_TAG="commit-${DATE_TAG}-${SHORT_SHA}"
            RELEASE_TITLE="Commit Build (${DATE_TAG}-${SHORT_SHA})"
          fi
          ACTOR_LOWER=$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV
          echo "RELEASE_TITLE=${RELEASE_TITLE}" >> $GITHUB_ENV
          echo "FULL_IMAGE_NAME=${{ env.REGISTRY }}/${ACTOR_LOWER}/${{ env.OCI_IMAGE_NAME }}" >> $GITHUB_ENV
          echo "CURRENT_ISO_NAME=${{ env.ISO_BASE_NAME }}-${RELEASE_TAG}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push OS Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: |
            ${{ env.FULL_IMAGE_NAME }}:latest
            ${{ env.FULL_IMAGE_NAME }}:${{ env.RELEASE_TAG }}
          build-args: |
            REPO=${{ env.FULL_IMAGE_NAME }}
            VERSION=${{ env.RELEASE_TAG }}

      - name: Build Bootable ISO and Split if Exceeds 1.5GB
        run: |
          mkdir -p build-output release-assets
          docker run --rm -v $(pwd)/build-output:/build --privileged \
            ${{ env.FULL_IMAGE_NAME }}:${{ env.RELEASE_TAG }} \
            elemental --debug build-iso \
            --name ${{ env.CURRENT_ISO_NAME }} \
            --bootloader-in-rootfs \
            -o /build \
            docker:${{ env.FULL_IMAGE_NAME }}:${{ env.RELEASE_TAG }}

          ISO_PATH="build-output/${{ env.CURRENT_ISO_NAME }}.iso"
          FILE_SIZE=$(stat -c%s "${ISO_PATH}")
          MAX_SIZE=1572864000
          cd build-output
          sha256sum "${{ env.CURRENT_ISO_NAME }}.iso" > "../release-assets/${{ env.CURRENT_ISO_NAME }}.iso.sha256"

          if [ "${FILE_SIZE}" -gt "${MAX_SIZE}" ]; then
            echo "ISO exceeds 1.5GB, splitting..."
            split -b 1500M -d -a 2 "${{ env.CURRENT_ISO_NAME }}.iso" "${{ env.CURRENT_ISO_NAME }}.iso.part"
            mv ${{ env.CURRENT_ISO_NAME }}.iso.part* ../release-assets/
            cd ../release-assets
            sha256sum ${{ env.CURRENT_ISO_NAME }}.iso.part* >> "${{ env.CURRENT_ISO_NAME }}.iso.sha256"
            echo "IS_SPLIT=true" >> $GITHUB_ENV
          else
            mv "${{ env.CURRENT_ISO_NAME }}.iso" ../release-assets/
            echo "IS_SPLIT=false" >> $GITHUB_ENV
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          files: release-assets/*
          body: |
            ### Elemental OS Image Release
            - **Event:** `${{ github.event_name }}`
            - **Commit SHA:** `${{ github.sha }}`
            - **OCI Image (Latest):** `${{ env.FULL_IMAGE_NAME }}:latest`
            - **OCI Image (Immutable Tag):** `${{ env.FULL_IMAGE_NAME }}:${{ env.RELEASE_TAG }}`
            - **Split Files:** `${{ env.IS_SPLIT }}`
            ${{ env.IS_SPLIT == 'true' && format('#### 拼接 ISO 命令：
            ```bash
            cat {0}.iso.part* > {0}.iso
            sha256sum -c {0}.iso.sha256
            ```', env.CURRENT_ISO_NAME) || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # =========================================================================
      # 官方 RAW + 自定义 RAW 方法（含超过 1.5GB 自动切片）
      # =========================================================================
      - name: Build Custom Size RAW by Copying Partitions
        run: |
          set -e
          # 释放宿主机物理空间：删除上一步残留在 build-output 的 ISO 
          # (ISO 已被移动/复制到 release-assets 中，这里可以安全删除)
          echo "==> 0.1 清除 ISO 构建残留释放 Runner 空间..."
          rm -rf build-output/*.iso* || true
          docker system prune -a -f --volumes || true
          mkdir -p build-output raw-draft-assets work
          RAW_BASE_NAME="${{ env.ISO_BASE_NAME }}-${{ env.RELEASE_TAG }}"
          CUSTOM_RAW="build-output/${RAW_BASE_NAME}.raw"

          echo "==> 1. 用官方 elemental 生成完整可用的临时 RAW..."
          docker run --rm \
            -v $(pwd)/work:/work \
            --privileged \
            ${{ env.FULL_IMAGE_NAME }}:${{ env.RELEASE_TAG }} \
            elemental --debug build-disk \
            --name official \
            --output /work \
            --type raw \
            --system "docker:${{ env.FULL_IMAGE_NAME }}:${{ env.RELEASE_TAG }}"

          OFFICIAL_RAW=$(ls work/*.raw | head -n 1)
          echo "Official RAW: ${OFFICIAL_RAW}"

          echo "==> 2. 创建 98G 自定义分区 RAW..."
          truncate -s 98G "${CUSTOM_RAW}"

          echo "==> 3. 分区：EFI 64M + OEM 64M + Recovery 8G + State 30G + Persistent 剩余..."
          sgdisk -o "${CUSTOM_RAW}"
          sgdisk -n=1:2048:+64M -c=1:efi -t=1:EF00 "${CUSTOM_RAW}"
          sgdisk -n=2:0:+64M -c=2:oem -t=2:8300 "${CUSTOM_RAW}"
          sgdisk -n=3:0:+8G -c=3:recovery -t=3:8300 "${CUSTOM_RAW}"
          sgdisk -n=4:0:+30G -c=4:state -t=4:8300 "${CUSTOM_RAW}"
          sgdisk -n=5:0:0 -c=5:persistent -t=5:8300 "${CUSTOM_RAW}"

          echo "==> 4. 挂载两个 RAW 的分区并复制内容..."
          OFFICIAL_LOOP=$(sudo losetup -f --show -P "${OFFICIAL_RAW}")
          CUSTOM_LOOP=$(sudo losetup -f --show -P "${CUSTOM_RAW}")
          echo "Official loop: ${OFFICIAL_LOOP}"
          echo "Custom loop: ${CUSTOM_LOOP}"

          sudo mkfs.vfat -n COS_GRUB "${CUSTOM_LOOP}p1"
          sudo mkfs.ext4 -L COS_OEM "${CUSTOM_LOOP}p2"
          sudo mkfs.ext4 -L COS_RECOVERY "${CUSTOM_LOOP}p3"
          sudo mkfs.btrfs -L COS_STATE -f "${CUSTOM_LOOP}p4"
          sudo mkfs.ext4 -L COS_PERSISTENT "${CUSTOM_LOOP}p5"

          mkdir -p /tmp/src /tmp/dst

          echo "Copying EFI..."
          sudo mount "${OFFICIAL_LOOP}p1" /tmp/src
          sudo mount "${CUSTOM_LOOP}p1" /tmp/dst
          sudo cp -a /tmp/src/. /tmp/dst/
          sudo umount /tmp/src /tmp/dst

          echo "Copying OEM..."
          sudo mount "${OFFICIAL_LOOP}p2" /tmp/src
          sudo mount "${CUSTOM_LOOP}p2" /tmp/dst
          sudo cp -a /tmp/src/. /tmp/dst/
          sudo umount /tmp/src /tmp/dst

          echo "Copying Recovery..."
          sudo mount "${OFFICIAL_LOOP}p3" /tmp/src
          sudo mount "${CUSTOM_LOOP}p3" /tmp/dst
          sudo cp -a /tmp/src/. /tmp/dst/
          sudo umount /tmp/src /tmp/dst

          echo "Copying State..."
          sudo mount "${OFFICIAL_LOOP}p4" /tmp/src
          sudo mount "${CUSTOM_LOOP}p4" /tmp/dst
          sudo cp -a /tmp/src/. /tmp/dst/ || true
          sudo umount /tmp/src /tmp/dst

          echo "Copying Persistent (if any)..."
          if sudo mount "${OFFICIAL_LOOP}p5" /tmp/src 2>/dev/null; then
            sudo mount "${CUSTOM_LOOP}p5" /tmp/dst
            sudo cp -a /tmp/src/. /tmp/dst/ || true
            sudo umount /tmp/src /tmp/dst
          fi

          sudo losetup -d "${OFFICIAL_LOOP}"
          sudo losetup -d "${CUSTOM_LOOP}"
          rm -rf /tmp/src /tmp/dst

          echo "==> 5. 压缩自定义 RAW 并检查是否需要切片..."
          XZ_FILE_NAME="${RAW_BASE_NAME}.raw.xz"
          XZ_FILE="raw-draft-assets/${XZ_FILE_NAME}"
          xz -T0 -v -6 < "${CUSTOM_RAW}" > "${XZ_FILE}"
          rm -f "${CUSTOM_RAW}"

          FILE_SIZE=$(stat -c%s "${XZ_FILE}")
          MAX_SIZE=1572864000

          cd raw-draft-assets
          sha256sum "${XZ_FILE_NAME}" > "${XZ_FILE_NAME}.sha256"

          if [ "${FILE_SIZE}" -gt "${MAX_SIZE}" ]; then
            echo "RAW.XZ size (${FILE_SIZE} bytes) exceeds 1.5GB. Splitting into 1500M parts..."
            split -b 1500M -d -a 2 "${XZ_FILE_NAME}" "${XZ_FILE_NAME}.part"
            rm -f "${XZ_FILE_NAME}"
            sha256sum ${XZ_FILE_NAME}.part* >> "${XZ_FILE_NAME}.sha256"
            echo "IS_RAW_SPLIT=true" >> $GITHUB_ENV
          else
            echo "RAW.XZ size (${FILE_SIZE} bytes) is within 1.5GB. Keeping intact..."
            echo "IS_RAW_SPLIT=false" >> $GITHUB_ENV
          fi

          echo "RAW_XZ_BASE_NAME=${XZ_FILE_NAME}" >> $GITHUB_ENV
          ls -lh

      - name: Publish Draft Release (RAW Disk Image)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ env.RELEASE_TAG }}-raw"
          name: "${{ env.RELEASE_TITLE }} [RAW Draft]"
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: false
          files: raw-draft-assets/*
          body: |
            ### Elemental Bootable RAW Disk Image (Draft) - Custom Partitions
            - **Disk size:** 98G
            - **Recovery:** 8G
            - **State:** 30G
            - **Persistent:** remaining space
            - **Method:** Copied from official elemental RAW
            - **Snapshotter:** btrfs
            - **Split Files:** `${{ env.IS_RAW_SPLIT }}`

            ${{ env.IS_RAW_SPLIT == 'true' && format('#### 拼接与还原 RAW 镜像命令：
            ```bash
            # 1. 拼接切片还原为完整 .raw.xz
            cat {0}.part* > {0}
            sha256sum -c {0}.sha256

            # 2. 解压还原为可引导 .raw 磁盘文件
            xz -d -T0 -v {0}
            ```', env.RAW_XZ_BASE_NAME) || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun ACR
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Push Image to Aliyun ACR
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        env:
          FULL_IMAGE_NAME: ${{ env.FULL_IMAGE_NAME }}
          OCI_IMAGE_NAME: ${{ env.OCI_IMAGE_NAME }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          ACR_REGISTRY: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ALIYUN_ACR_NAMESPACE }}
        run: |
          set -e
          if [ -z "$ACR_REGISTRY" ] || [ -z "$ACR_NAMESPACE" ]; then
            echo "Error: ALIYUN_ACR_REGISTRY or ALIYUN_ACR_NAMESPACE secret is not set!"
            exit 1
          fi
          GHCR_TAG_IMAGE="${FULL_IMAGE_NAME}:${RELEASE_TAG}"
          ALIYUN_TAG_IMAGE="${ACR_REGISTRY}/${ACR_NAMESPACE}/${OCI_IMAGE_NAME}:${RELEASE_TAG}"
          ALIYUN_LATEST_IMAGE="${ACR_REGISTRY}/${ACR_NAMESPACE}/${OCI_IMAGE_NAME}:latest"
          if ! docker image inspect "$GHCR_TAG_IMAGE" >/dev/null 2>&1; then
            docker pull "$GHCR_TAG_IMAGE"
          fi
          docker tag "$GHCR_TAG_IMAGE" "$ALIYUN_TAG_IMAGE"
          docker tag "$GHCR_TAG_IMAGE" "$ALIYUN_LATEST_IMAGE"
          docker push "$ALIYUN_TAG_IMAGE"
          docker push "$ALIYUN_LATEST_IMAGE"
